[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "tubedrop"
version = "1.1.0"
description = "tubedrop — local YouTube downloader with a web UI. Built on top of kaifcodec/ytconverter."
readme = "README.md"
license = {file = "LICENSE"}
authors = [
  {name = "RebSem"},
  {name = "Kaif"},
]
dependencies = [
  "yt-dlp",
]
requires-python = ">=3.9"
keywords = ["youtube", "downloader", "yt-dlp", "ffmpeg", "macos", "tubedrop"]

[project.urls]
Homepage = "https://github.com/RebSem/tubedrop"
Upstream = "https://github.com/kaifcodec/ytconverter"

[project.scripts]
tubedrop = "ytconverter.__main__:main"

[tool.flit.module]
name = "ytconverter"
